format: wp-error
rfc9457: false
note: 'This API does NOT use RFC 9457 problem+json. It returns the WordPress core error envelope as application/json:
  a flat object of code, message and data.status. An agent should branch on the string `code`, which is
  stable across WordPress releases, rather than on `message`, which is localised to the site language
  (en-GB here).'
envelope:
  media_type: application/json
  fields:
  - name: code
    type: string
    description: Stable machine-readable error identifier.
  - name: message
    type: string
    description: Human-readable, localised message. Not stable — do not match on it.
  - name: data
    type: object
    description: Error data object.
  - name: data.status
    type: integer
    description: HTTP status code, repeated inside the body.
  example:
    code: rest_post_invalid_id
    message: Invalid post ID.
    data:
      status: 404
