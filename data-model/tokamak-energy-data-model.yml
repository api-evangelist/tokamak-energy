  note: subtype names the owning collection (post, page, area-item); resolve id there for the full object.
traversal_notes:
- Use _embed on a posts request to inline author, featured media and terms in one round trip instead of
  four.
- Use _fields to trim rendered HTML out of a listing; it is the difference between a 22 KB page and a
  400 byte one.
- Numeric ids are site-local and are NOT stable identifiers of subject matter. The durable identifier
  for a news item is its `link` / `slug`.
