aid: tokamak-energy
name: Tokamak Energy
description: >-
  Tokamak Energy is a private fusion energy company founded in 2009 as a spinout from the UK Atomic
  Energy Authority, headquartered at 173 Brook Drive, Milton Park, Oxfordshire OX14 4SD, with
  subsidiaries in the United States and Japan and more than 300 employees. It runs a two-track
  strategy: advancing commercial fusion energy through compact spherical tokamaks, and developing
  high temperature superconducting (HTS) magnet technology as a business in its own right. Its
  flagship device ST40 is the world's highest field spherical tokamak and is undergoing a USD 52
  million upgrade co-funded with the US Department of Energy and the UK Department for Energy
  Security and Net Zero. Demo4 became the first HTS fusion magnet system to achieve fusion-relevant
  magnetic fields in 2025, and the company was selected as Magnet Systems Partner for the UK's STEP
  programme under a GBP 70 million contract running to 2029. The group is organised into three
  integrated businesses — TE Magnetics (HTS technology, established 2024), Ridgway Machines
  (manufacturing, acquired 2025) and Fusion. Tokamak Energy is a fusion and superconducting hardware
  company rather than a software vendor: it publishes no commercial or developer-facing product API,
  no developer portal, no SDKs and no OpenAPI of its own. The only machine-readable interface it
  exposes publicly is the WordPress REST content API behind its corporate website at
  tokamakenergy.com, which is anonymously readable, read-only for unauthenticated callers, and is
  captured here for discovery purposes. Its public engineering output is instead released as
  open-source plasma physics code — GSFit, RTGSFit and FORGE — through the tokamak-energy GitHub
  organisation.
